services:
  - type: web
    name: privies-campus-bites
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: "Privie's Admin"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PAYMENTS
        value: "false"
      - key: TAX_RATE
        value: "0.05"
      - key: SERVICE_RATE
        value: "0"
      - key: DISCOUNT_RATE
        value: "0"
